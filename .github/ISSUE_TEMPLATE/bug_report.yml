name: 问题反馈 / Bug report
description: 使用脱敏信息报告可复现的问题 / Report a reproducible issue without private data
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: '请勿粘贴密钥、密码、服务器 IP、飞书真实 ID、客户资料或完整日志。安全问题请按 SECURITY.md 私密报告。 Do not include credentials, customer data or raw logs.'
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      placeholder: 0.1.0a31
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 出错阶段 / Stage
      options:
        - Skill 与安装包 / Skill and download
        - 安装与 Setup / Installation and setup
        - 项目或飞书接入 / Project or Feishu
        - 脚本与视频任务 / Script or video task
        - 审核与下载 / Review or download
        - 更新与恢复 / Update or restore
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现、期望与实际结果 / Reproduction, expected and actual behavior
      description: 使用合成数据。只提供脱敏错误码和必要步骤，不粘贴完整日志。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查 / Before submitting
      options:
        - label: 已移除凭据、个人信息和客户资料 / Credentials, personal information and customer data are removed
          required: true
