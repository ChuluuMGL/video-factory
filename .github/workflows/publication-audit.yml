name: Private publication audit

on:
  push:
    branches: [main, codex/repository-publication-readiness]
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [all, source, releases, ci, ci_finding]
        default: all

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Inspect ${{ matrix.scope }} without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'push' && '["source"]' || inputs.scope == 'all' && '["source","releases","ci"]' || format('["{0}"]', inputs.scope)) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify private scope and install pinned scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PRIVATE
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/scanner"
          cd "$RUNNER_TEMP/scanner"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Read and scan repository objects in cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publication-audit.py '${{ matrix.scope }}'
      - name: Retain only redacted finding metadata
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-audit-${{ matrix.scope }}-${{ github.run_id }}
          path: audit-results/*.json
          retention-days: 14
