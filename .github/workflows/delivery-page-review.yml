name: Installation page review

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing fixed release to keep while updating only the page'
        type: string
        default: ''
  pull_request:
    paths:
      - 'delivery/site/**'
      - 'skills/video-factory-setup/**'
      - 'docs/product/CUSTOMER_GUIDE.md'
      - '.github/scripts/delivery-smoke.py'
      - '.github/scripts/brand-parity-smoke.py'
      - 'packages/video-factory-core/src/video_factory/*_assets/style.css'
      - '.github/scripts/build-delivery.py'
      - '.github/workflows/delivery-page-review.yml'

permissions:
  contents: read

concurrency:
  group: delivery-page-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  page:
    name: Installation guide desktop and mobile
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Prepare browser and actual candidate package inputs
        run: |
          python -m pip install "playwright==1.55.0" "PyYAML==6.0.2"
          sudo "$(command -v python)" -m playwright install --with-deps chrome
          sudo apt-get install -y fonts-noto-cjk
      - name: Assemble inputs from a fixed release or candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            [[ "$RELEASE_TAG" =~ ^v0\.1\.0a[0-9]+$ ]]
            gh release download "$RELEASE_TAG" --pattern release.json --pattern handoff.json --pattern video-factory-setup.zip --dir ci-page/release
            python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('ci-page/release')
          r=json.loads((root/'release.json').read_text()); h=json.loads((root/'handoff.json').read_text())
          assert 'v'+r['version']==os.environ['RELEASE_TAG'] and r['version']==h['version']
          for k in ('source_commit','archive_sha256','manifest_sha256'): assert r[k]==h[k]
          PY
          else
            python -m pip wheel --no-deps --wheel-dir ci-page/wheels ./packages/video-factory-core
            python -m pip download --only-binary=:all: --dest ci-page/wheels "cryptography==46.0.5" "psycopg[binary]==3.3.6"
            python .github/scripts/build-release.py --out ci-page/release --wheels ci-page/wheels --source "$(git rev-parse HEAD)"
          fi
      - name: Assemble draft and verify reader interactions
        run: |
          python .github/scripts/validate-skill.py skills/video-factory-setup
          python .github/scripts/build-delivery.py --out ci-page/site --receipt ci-page/release/release.json --repository "$GITHUB_REPOSITORY"
          if [ -f ci-page/release/video-factory-setup.zip ]; then
            cmp ci-page/release/video-factory-setup.zip ci-page/site/video-factory-setup.zip
          fi
          python .github/scripts/delivery-smoke.py ci-page/site ci-page/evidence
      - name: Compare typography with the live official AI page
        run: python .github/scripts/brand-parity-smoke.py ci-page/site ci-page/evidence
      - name: Preserve screenshots and page checks
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installation-page-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-page/evidence/
          retention-days: 14
      - name: Preserve exact reviewed guide
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'workflow_dispatch'
        with:
          name: reviewed-installation-guide
          path: ci-page/site/
          retention-days: 90
      - name: Preserve private page review outside temporary artifact storage
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PRIVATE
          python - <<'PY'
          import shutil
          from pathlib import Path
          shutil.make_archive('reviewed-installation-guide','zip','ci-page/site')
          shutil.make_archive('page-review-evidence','zip','ci-page/evidence')
          Path('page-review-notes.md').write_text('Installation page review only. Server installer and Skill remain at the selected fixed release. Includes the exact reviewed page and synthetic browser screenshots; no customer data or credentials.\n')
          PY
          gh release create "guide-review-$GITHUB_RUN_ID" --target "$GITHUB_SHA" --prerelease --title "Installation guide review $GITHUB_RUN_ID" --notes-file page-review-notes.md reviewed-installation-guide.zip page-review-evidence.zip
      - name: Record review scope
        if: always()
        run: |
          echo 'This run checks the installation page and Skill packaging. It does not publish a release or website, replace the full regression gate, call paid models or validate a customer installation.' >> "$GITHUB_STEP_SUMMARY"
