name: Portable Windows install diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - strategy: pnpm
            location: runner_temp
            limit: 720
    env:
      VF_INSTALL_STRATEGY: ${{ matrix.strategy }}
      VF_INSTALL_LOCATION: ${{ matrix.location }}
      VF_INSTALL_LIMIT: ${{ matrix.limit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect isolated npm installation without business credentials
        run: python .github/scripts/portable-install-diagnostic.py
