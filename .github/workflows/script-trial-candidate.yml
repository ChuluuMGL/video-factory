name: Script trial candidate checks
on:
  push:
    branches: [codex/hd01-shadow-preparation]
permissions:
  contents: read
concurrency:
  group: script-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  script-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ./packages/video-factory-core
      - name: Copy-only trial fences and bounded provider receipts, no external network
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up; exec "$@"' sh "$(command -v python)" -m unittest discover -s packages/video-factory-core/tests -p 'test_script_provider.py' -v
          sudo unshare --net -- sh -c 'ip link set lo up; exec "$@"' sh "$(command -v python)" -m unittest discover -s packages/video-factory-core/tests -p 'test_script_trial.py' -v
          sudo unshare --net -- sh -c 'ip link set lo up; exec "$@"' sh "$(command -v python)" -m unittest discover -s packages/video-factory-core/tests -p 'test_prepared_script_provider.py' -v
