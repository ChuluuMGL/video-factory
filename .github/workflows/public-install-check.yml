name: Approved beta publication and anonymous installation
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [stage, verify]
        required: true
      source_urls:
        type: string
        default: '{}'
permissions:
  contents: read
jobs:
  stage:
    if: inputs.operation == 'stage'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Transfer approved original assets; no build
        env:
          SOURCE_URLS: ${{ inputs.source_urls }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/approved-beta/transfer.py
  verify:
    if: inputs.operation == 'verify'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x86_64
          - os: macos-15
            asset: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Anonymous public download and fresh install
        env:
          VF_ASSET: ${{ matrix.asset }}
        run: python3 .github/scripts/approved-beta/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-download-${{ matrix.asset }}
          path: public-install-evidence.json
          if-no-files-found: warn
