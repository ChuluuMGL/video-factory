name: Video provider contracts
on:
  pull_request:
    paths:
      - 'packages/video-factory-core/src/video_factory/video_provider_candidates.py'
      - 'packages/video-factory-core/tests/test_video_provider_candidates.py'
      - '.github/workflows/video-provider-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify synthetic provider contracts without network
        run: |
          python -m pip install ./packages/video-factory-core
          sudo unshare --net -- "$(command -v python)" -m unittest discover -s packages/video-factory-core/tests -p 'test_video_provider_candidates.py' -v
