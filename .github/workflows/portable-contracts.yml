name: Portable CLI contracts
on:
  workflow_dispatch:
  push:
    branches: [codex/portable-cli-error-boundary]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install relay test dependencies
        run: python -m pip install cryptography==46.0.5 lark-oapi==1.7.3 websockets==15.0.1
      - name: Actual CLI entry and portable contracts
        run: python -m unittest discover -s tests/portable -v
