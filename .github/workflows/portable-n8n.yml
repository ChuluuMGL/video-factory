name: Portable n8n
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'skills/video-factory-setup/scripts/**'
      - 'tests/portable/**'
      - '.github/scripts/portable-n8n-smoke.py'
      - '.github/workflows/portable-n8n.yml'
permissions:
  contents: read
concurrency:
  group: portable-n8n-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native n8n on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install pinned event relay dependencies
        run: python -m pip install cryptography==46.0.5 lark-oapi==1.7.3 websockets==15.0.1
      - name: Portable failure and preservation tests
        run: python -m unittest discover -s tests/portable -v
      - name: Real native n8n install, API import and Feishu writeback fixture
        run: python .github/scripts/portable-n8n-smoke.py node
  docker:
    name: Docker n8n actual integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Real Docker n8n install, API import and Feishu writeback fixture
        run: python .github/scripts/portable-n8n-smoke.py docker
